server:
  port: 8081
spring:
  application:
    name: tongcheng
  # Spring Boot 2.6+ 默认禁止循环引用，本项目的自注入（事务代理 proxy）需要放行
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/tongcheng?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: a359938435
  redis:
    host: 192.168.184.128
    port: 6379
    password: "07210721" # 必须以字符串形式书写,否则 YAML 会把 0 开头的数字解析成八进制
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.tongcheng.entity # 别名扫描包
logging:
  level:
    com.tongcheng: debug
